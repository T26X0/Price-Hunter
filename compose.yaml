services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: price_hunter
      POSTGRES_USER: price_hunter
      POSTGRES_PASSWORD: local_dev_only
    ports:
      - "5432:5432"
    volumes:
      - price-hunter-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U price_hunter -d price_hunter"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  price-hunter-postgres:
